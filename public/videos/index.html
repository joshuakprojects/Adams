<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Adams Bros Dispatch · How-to videos</title>
<link rel="icon" type="image/png" href="/brand/favicon-64.png">
<style>
  :root { --brand: #FFD101; --ink: #111; --muted: #5f5f5b; --bg: #f2f2f0; --card: #fff; --line: #e2e2de; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 Poppins, system-ui, -apple-system, Segoe UI, Arial, sans-serif; }
  header { background: var(--ink); color: #fff; border-bottom: 5px solid var(--brand); padding: 22px max(16px, env(safe-area-inset-left)); }
  header .in, main { max-width: 1100px; margin: 0 auto; }
  header .k { color: var(--brand); font: 700 12px/1 Arial, sans-serif; letter-spacing: .2em; text-transform: uppercase; }
  h1 { margin: 8px 0 4px; font: 800 30px/1.1 Arial Narrow, Arial, sans-serif; text-transform: uppercase; }
  header p { margin: 0; color: #ccc; font-size: 15px; }
  main { padding: 20px 16px 60px; display: grid; gap: 26px; }
  h2 { margin: 0 0 10px; font: 700 14px/1 Arial, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .v { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .v video { display: block; width: 100%; background: #000; aspect-ratio: 16 / 9; }
  .v.phone video { aspect-ratio: 390 / 664; max-height: 70vh; margin: 0 auto; width: auto; max-width: 100%; }
  .v div { padding: 10px 14px 12px; }
  .v b { display: block; }
  .v span { color: var(--muted); font-size: 14px; }
</style>
</head><body>
<header><div class="in"><div class="k">Adams Bros Dispatch</div><h1>How-to videos</h1><p>Short videos showing how each part works. Sound on, or read the captions.</p></div></header>
<main id="m"></main>
<script src="/videos/list.js"></script>
<script>
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const groups = [...new Set(AB_VIDEOS.map((v) => v.who))];
  document.getElementById('m').innerHTML = groups.map((g) => `<section><h2>${esc(g)}</h2><div class="grid">${AB_VIDEOS.filter((v) => v.who === g).map((v) => `
    <div class="v ${v.phone ? 'phone' : ''}" id="${v.slug}"><video controls playsinline preload="none" poster="/videos/${v.slug}.jpg" src="/videos/${v.slug}.mp4"></video>
      <div><b>${esc(v.title)}</b><span>${AB_VIDEO_LEN(v.secs)}</span></div></div>`).join('')}</div></section>`).join('');
  // Only one plays at a time.
  document.addEventListener('play', (e) => document.querySelectorAll('video').forEach((v) => { if (v !== e.target) v.pause(); }), true);
  if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
</script>
</body></html>
