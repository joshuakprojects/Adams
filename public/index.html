<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dispatch Board</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Dispatch</div>
    <nav class="tabs">
      <button data-tab="board" class="active">Board</button>
      <button data-tab="people">Drivers &amp; Trucks</button>
      <button data-tab="messages">Texts <span id="alert-count" class="count hidden"></span></button>
    </nav>
    <div class="spacer"></div>
    <span id="test-mode" class="test-mode hidden" title="Twilio isn't set up yet. Texts are printed in the server log, not sent.">TEST MODE – texts not sent</span>
    <span id="user-name" class="muted"></span>
    <button id="logout" class="link">Log out</button>
  </header>

  <!-- BOARD -->
  <section id="tab-board" class="tab">
    <div class="toolbar">
      <button class="btn" data-day="-1" aria-label="Previous day">◀</button>
      <button class="btn" data-day="0">Today</button>
      <button class="btn" data-day="1" aria-label="Next day">▶</button>
      <input type="date" id="board-date">
      <h2 id="board-title"></h2>
      <div class="spacer"></div>
      <button class="btn primary big" id="new-job">+ New job</button>
    </div>
    <div id="alerts"></div>
    <div class="board">
      <div id="jobs" class="jobs"></div>
      <aside class="drivers-panel">
        <h3>Drivers today</h3>
        <div id="driver-list"></div>
      </aside>
    </div>
  </section>

  <!-- DRIVERS & TRUCKS -->
  <section id="tab-people" class="tab hidden">
    <div class="two-col">
      <div class="panel">
        <h2>Drivers</h2>
        <form id="driver-form" class="inline-form">
          <input type="hidden" name="id">
          <input name="name" placeholder="Name" required>
          <input name="phone" placeholder="Cell (403-555-1234)" required>
          <select name="default_truck_id"></select>
          <label class="check"><input type="checkbox" name="active" checked> Active</label>
          <button class="btn primary" type="submit">Save driver</button>
          <button class="btn" type="reset">Clear</button>
        </form>
        <table class="table"><thead><tr><th>Name</th><th>Cell</th><th>Usual truck</th><th></th></tr></thead>
          <tbody id="driver-rows"></tbody></table>
      </div>
      <div class="panel">
        <h2>Trucks</h2>
        <form id="truck-form" class="inline-form">
          <input type="hidden" name="id">
          <input name="unit" placeholder="Unit # (e.g. T12)" required>
          <select name="kind">
            <option value="haul">Gravel / end dump</option>
            <option value="float">Float / lowbed</option>
            <option value="septic">Septic pump</option>
            <option value="other">Other</option>
          </select>
          <input name="description" placeholder="Description (Kenworth tri-axle…)">
          <label class="check"><input type="checkbox" name="active" checked> Active</label>
          <button class="btn primary" type="submit">Save truck</button>
          <button class="btn" type="reset">Clear</button>
        </form>
        <table class="table"><thead><tr><th>Unit</th><th>Type</th><th>Description</th><th></th></tr></thead>
          <tbody id="truck-rows"></tbody></table>
      </div>
    </div>
  </section>

  <!-- MESSAGES -->
  <section id="tab-messages" class="tab hidden">
    <div class="panel">
      <h2>Text log</h2>
      <form id="simulate" class="inline-form hidden">
        <strong>Try a driver reply:</strong>
        <select name="phone" id="sim-driver"></select>
        <input name="body" placeholder="OK" required>
        <button class="btn" type="submit">Send as driver</button>
        <span id="sim-result" class="muted"></span>
      </form>
      <div id="message-list"></div>
    </div>
  </section>

  <!-- JOB FORM -->
  <dialog id="job-dialog">
    <form id="job-form" method="dialog">
      <div class="dialog-head">
        <h2 id="job-form-title">New job</h2>
        <button type="button" class="link" data-close>✕</button>
      </div>
      <input type="hidden" name="id">
      <div class="segmented" id="job-type">
        <label><input type="radio" name="job_type" value="haul" checked><span>🪨 Haul</span></label>
        <label><input type="radio" name="job_type" value="float"><span>🚜 Float</span></label>
        <label><input type="radio" name="job_type" value="septic"><span>💧 Septic</span></label>
      </div>
      <div class="grid">
        <label>Date <input type="date" name="scheduled_date" required></label>
        <label>Start time <input type="time" name="scheduled_time"></label>
        <label class="wide">Customer <input name="customer" list="dl-customers" autocomplete="off"></label>

        <label class="wide"><span data-label="what">Material</span>
          <input name="material" list="dl-materials" autocomplete="off"></label>
        <label><span data-label="qty">Quantity</span> <input name="quantity" placeholder="e.g. 200"></label>
        <label><span>Unit</span> <input name="unit" list="dl-units" placeholder="tonnes / yards"></label>
        <label data-show="haul septic"><span>Number of loads</span> <input type="number" name="loads_planned" min="0" max="999"></label>

        <label class="wide"><span data-label="from">From (pit / yard)</span>
          <input name="from_location" list="dl-locations" autocomplete="off"></label>
        <label class="wide"><span data-label="to">Deliver to</span>
          <input name="to_location" list="dl-locations" autocomplete="off"></label>
        <label>Site contact <input name="contact_name"></label>
        <label>Contact phone <input name="contact_phone" type="tel"></label>
        <label class="wide">Notes for driver <textarea name="notes" rows="2" placeholder="Gate code, where to dump, tarp required…"></textarea></label>
      </div>

      <h3>Drivers</h3>
      <p class="muted small">Tick everyone on this job. Pick the truck each one is taking.</p>
      <div id="assign-list" class="assign-list"></div>

      <div id="job-form-error" class="error"></div>
      <div class="dialog-foot">
        <button type="button" class="btn" data-close>Close</button>
        <div class="spacer"></div>
        <button type="submit" class="btn" value="save">Save only</button>
        <button type="submit" class="btn primary big" value="send">Save &amp; text drivers</button>
      </div>
    </form>
  </dialog>

  <datalist id="dl-customers"></datalist>
  <datalist id="dl-materials"></datalist>
  <datalist id="dl-locations"></datalist>
  <datalist id="dl-units"></datalist>

  <div id="toast" class="toast hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
